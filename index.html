<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Top navigation -->
   <header class="top-bar">

    <div class="top-links">

        <!-- Gmail -->
        <a href="https://mail.google.com/mail/u/0/" target="_blank">
            Gmail
        </a>

        <!-- Google Images -->
        <a href="https://images.google.com/" target="_blank">
            Images
        </a>

        <!-- Google Apps -->
        <a
            href="https://www.google.com/intl/en/about/products"
            target="_blank"
            class="apps-button"
        >
            ☷
        </a>

        <!-- Google Account -->
        <a
            href="https://myaccount.google.com/"
            target="_blank"
            class="profile-button"
        >
            D
        </a>

    </div>

    </header>


    <!-- Main content -->
    <main class="main-content">

        <!-- Logo -->
        <div class="logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>


        <!-- Search -->
        <form class="search-box" action="https://www.google.com/search" method="GET">

    <span class="search-icon">⌕</span>

    <input
        class="input"
        type="text"
        name="q"
        placeholder="Search Google or type a URL"
        autocomplete="on"
    >

    <span class="mic">🎤</span>

</form>
            <span class="mic">🎤</span>

        </div>


        <!-- Buttons -->   
    <form action="https://www.google.com/search" method="GET">    
        <div class="search-buttons">

            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>

        </div>
    </form>    
    

<main>
        <!-- Shortcuts -->
        <div class="shortcuts">

    <a class="Google" href="https://www.google.com" target="_blank">
        <div class="shortcut-icon">G</div><br>
    </a>

    <a class="Youtube" href="https://www.youtube.com" target="_blank">
        <div class="shortcut-icon">▶</div>
    </a>

    <a class="Facebook" href="https://www.facebook.com" target="_blank">
        <div class="shortcut-icon">F</div>
    </a>
    <a href="https://wa.me/" target="_blank" class="whatsapp-btn">
  <i class="fab fa-whatsapp"></i>
    </a>
    
</div>
        </div>

    </main>

</body>
</html>
